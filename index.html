</style></head><body>
<h1>🎲 Tycoon Town</h1>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const G=[["brown","#8b5a2b",60],["lblue","#6ec6f0",100],["pink","#f06eb4",140],["orange","#f59a23",180],["red","#e03a3a",220],["yellow","#f2d21b",260],["green","#2e9e4f",300],["blue","#2a4fc4",350]];
const N={1:"Mud Lane",2:"Pebble St",6:"Pond Way",7:"Rain Rd",9:"Candy Ave",11:"Cupcake Ln",13:"Sunset Blvd",14:"Tiger Trail",17:"Fire Rd",18:"Dino Dr",21:"Sunny Sq",22:"Banana Blvd",25:"Park Pl",26:"Forest Way",30:"Castle Ct",31:"Rocket Rd"};
const GI={1:0,2:0,6:1,7:1,9:2,11:2,13:3,14:3,17:4,18:4,21:5,22:5,25:6,26:6,30:7,31:7};
const RR={4:"Red Line",12:"Blue Line",20:"Green Line",28:"Gold Line"},UT={10:["Electric Co.","💡"],23:["Water Works","🚰"]},TX={5:["Income Tax",200],29:["Luxury Tax",100]},CC={3:1,19:1},NT=32;
const T=[];for(let i=0;i<NT;i++){const g=GI[i];T.push(g!==undefined?{t:"prop",g,c:G[g][1],p:G[g][2],n:N[i]}:RR[i]?{t:"rr",p:200,n:RR[i],c:"#9fb3c8",ic:"🚂"}:UT[i]?{t:"ut",p:150,n:UT[i][0],c:"#b8c4d6",ic:UT[i][1]}:TX[i]?{t:"tax",n:TX[i][0],a:TX[i][1]}:CC[i]?{t:"cc"}:{t:{0:"go",8:"jail",16:"park",24:"gtj"}[i]||"chance"})}
const IC={go:"🏁",jail:"🚧",park:"🅿️",gtj:"👮",chance:"❓",rr:"🚂",ut:"💡",tax:"💰",cc:'<svg viewBox="0 0 24 24" width="19" height="19"><path d="M3 11a9 9 0 0 1 18 0v2H3z" fill="#a0642d"/><rect x="3" y="12" width="18" height="9" rx="1.5" fill="#7a4a1e"/><rect x="6" y="4" width="1.8" height="17" fill="#f5c542"/><rect x="16.2" y="4" width="1.8" height="17" fill="#f5c542"/><rect x="3" y="11" width="18" height="2.4" fill="#f5c542"/><rect x="10.2" y="10" width="3.6" height="6" rx=".8" fill="#ffd966" stroke="#8a5a00" stroke-width=".6"/><circle cx="12" cy="13" r=".9" fill="#5a3b00"/></svg>'};
const TOK=["🐶","🐱","🦖","🚀","🦄","🐸"];
const pos=i=>i<=8?[8,8-i]:i<=16?[16-i,0]:i<=24?[0,i-16]:[i-24,8];
const myId=Math.random().toString(36).slice(2,8);
let S={players:[],own:{},h:{},mg:{},tr:null,turn:0,phase:"menu",log:"Welcome!",dice:[0,0],win:null},room=null,host=true,code="",draft={e:TOK[0],mode:"kid",name:""};
const $=id=>document.getElementById(id);
const cur=()=>S.players[S.turn];
const mine=()=>cur()&&cur().by===myId&&!cur().cpu;
const fm=(p,v)=>p.mode==="kid"?"🪙"+Math.round(v/10):"$"+v;
function sync(){render();try{if(S.phase!=="menu"&&S.phase!=="lobby")localStorage.setItem("tt3",JSON.stringify(S))}catch(e){}if(room)room.emit("state",S).catch(()=>{})}
function log(m){S.log=m}
function rent(i){const o=S.own[i],t=T[i];if(t.t==="ut")return(S.dice[0]+S.dice[1])*(T.filter((x,k)=>x.t==="ut"&&S.own[k]===o).length>1?10:4);if(t.t==="rr")return 25*2**(T.filter((x,k)=>x.t==="rr"&&S.own[k]===o).length-1);
 const h=S.h[i]||0,b=t.p/10;return h?b*[0,5,15,40,60,80][h]:T.every((x,k)=>x.g!==t.g||S.own[k]===o)?b*2:b}
function broke(p,f){if(p.m>=0)return;if(p.mode==="kid"){p.m=100;log("The bank gave "+p.n+" some coins!")}else if(!f&&worth(p)+p.m>=0){S.phase="debt";log(p.n+" owes money! Sell or mortgage to pay.")}else{p.out=true;const k=S.players.indexOf(p);for(const i in S.own)if(S.own[i]===k){delete S.own[i];delete S.h[i];delete S.mg[i]}log(p.n+" is out of money!");const l=S.players.filter(x=>!x.out);if(l.length===1)S.win=l[0].n}}
function cc(p){const r=Math.random()*5|0;
 if(r===0){p.m+=150;log("🪙 You sold a lemonade stand! +150")}
 else if(r===1){S.players.forEach(q=>{if(q!==p&&!q.out){q.m-=20;p.m+=20}});log("🪙 Birthday! Everyone gives you 20")}
 else if(r===2){if(p.mode==="kid"){p.m+=50;log("🪙 Found a lucky coin! +50")}else{p.m-=75;log("🪙 School fee: -75");broke(p)}}
 else if(r===3){p.m+=50;log("🪙 Bank error in your favor! +50")}
 else{p.goj=(p.goj||0)+1;log("🪙 You got a Get Out of Timeout Free card! 🎟️")}}
function roll(){S.phase="rolling";sync();setTimeout(roll2,800)}
function roll2(){const a=1+Math.random()*6|0,b=1+Math.random()*6|0,p=cur();S.dice=[a,b];S.dbl=a===b&&!p.jail;S.dc=S.dbl?(S.dc||0)+1:0;if(S.dc>=3){S.dbl=false;S.dc=0;p.pos=8;p.jail=1;log(p.n+" rolled 3 doubles: timeout!");S.phase="end";return sync()}
 if(p.jail){if(a===b||p.jail>=3){p.jail=0;log(p.n+" got out of timeout!")}else{p.jail++;S.phase="end";log(p.n+" is still in timeout");return sync()}}
 move(p,a+b)}
function move(p,n){S.phase="moving";if(n<=0)return land(p);p.pos=(p.pos+1)%NT;if(p.pos===0){p.m+=200;log(p.n+" passed GO! +200")}sync();setTimeout(()=>move(p,n-1),320)}
function land(p){const i=p.pos,t=T[i];S.phase="end";log(p.n+" landed on "+(t.n||t.t));
 if(t.t==="prop"||t.t==="rr"||t.t==="ut"){const o=S.own[i];if(o===undefined)S.phase="buy";else if(o!==S.turn&&!S.mg[i]){let r=rent(i);if(p.mode==="kid")r=r/2;p.m-=r;S.players[o].m+=r;log(p.n+" paid "+fm(p,r)+" rent to "+S.players[o].n);broke(p)}}
 else if(t.t==="tax"){const a=p.mode==="kid"?t.a/2:t.a;p.m-=a;log(p.n+" paid "+t.n+" "+fm(p,a));broke(p)}
 else if(t.t==="cc"){cc(p)}
 else if(t.t==="gtj"){p.pos=8;p.jail=1;log(p.n+" goes to timeout!")}
 else if(t.t==="park"){p.m+=50;log(p.n+" found 50 at the park!")}
 else if(t.t==="chance"){const r=Math.random()*5|0;
  if(r===0){p.m+=100;log("❓ Found treasure! +100")}
  else if(r===1){if(p.mode==="kid"){p.m+=50;log("❓ Ice cream day! +50")}else{p.m-=50;log("❓ Repair bill! -50");broke(p)}}
  else if(r===2){p.pos=0;p.m+=200;log("❓ Zoom to GO! +200")}
  else if(r===3){log("❓ Hop forward 3!");return move(p,3)}
  else{p.goj=(p.goj||0)+1;log("❓ You got a Get Out of Timeout Free card! 🎟️")}}
 sync()}
function buy(){const p=cur(),i=p.pos,c=T[i].p;if(p.m>=c){p.m-=c;S.own[i]=S.turn;log(p.n+" bought "+T[i].n+"!")}S.phase="end";sync()}

function bc(i){return Math.round(T[i].p/20)*10}
function mono(i,k){return T[i].t==="prop"&&T.every((x,j)=>x.g!==T[i].g||S.own[j]===k)}
function bld(){if(S.phase!=="roll"&&S.phase!=="end")return"";const p=cur(),k=S.turn,cand=[];for(let i=0;i<NT;i++)if(S.own[i]===k&&mono(i,k))cand.push(i);
 if(!cand.length)return"";let h='<button class="alt" onclick="draft.b=!draft.b;render()">🏗️ Build</button>';
 if(draft.b)h+='<div class="card" style="text-align:left">'+cand.map(i=>{const n=S.h[i]||0;return`<div class="pl"><span>${n===5?"🏨":"🏠".repeat(n)||"▫️"} ${T[i].n}</span>${n<5?`<button class="good" style="margin:0" onclick="build(${i})">+ ${n===4?"Hotel":"House"} ${fm(p,bc(i))}</button>`:"<small>Max</small>"}</div>`}).join("")+"</div>";return h}
function build(i){const p=cur(),n=S.h[i]||0,c=bc(i),lo=Math.min(...T.map((x,j)=>x.g===T[i].g?(S.h[j]||0):9));
 if(n>=5||p.m<c||n>lo){log(n>lo?"Build evenly across the set first!":"Not enough money yet");return sync()}
 p.m-=c;S.h[i]=n+1;log(p.n+" built "+(n===4?"a hotel":"a house")+" on "+T[i].n+"!");sync()}
function cpuBuild(q){for(let i=0;i<NT;i++)if(S.own[i]===S.turn&&mono(i,S.turn)&&q.m>bc(i)+300)build(i)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";");
function pick(k,v){draft[k]=v;render()}
const FL=["🎲","🏠","🏨","🪙","💰","🎩","🚀","🦖","🦄","🐶","🐱","🎈"];
const fl=FL.map((e,i)=>`<span class="fl" style="--x:${(i*8.7+3)%92}%;--s:${28+(i*11)%26}px;--d:${9+(i*5)%8}s;--w:-${(i*3)%9}s">${e}</span>`).join("");
function sky(){let x=0,s="";const hs=[40,65,50,80,45,70,55,90,48,62];for(let i=0;x<400;i++){const w=34+(i*7)%18,h=hs[i%10];s+=`<rect x="${x}" y="${100-h}" width="${w-2}" height="${h}" fill="#1a0b3a"/>`;for(let y=100-h+8;y<92;y+=14)for(let k=4;k<w-8;k+=10)if((i+y+k)%3)s+=`<rect class="wn" style="animation-delay:${(y+k)%5}s" x="${x+k}" y="${y}" width="4" height="6" fill="#ffd23f"/>`;x+=w}return`<svg class="sky" viewBox="0 0 400 100" preserveAspectRatio="xMidYMax slice">${s}</svg>`}
function sv(){try{const s=JSON.parse(localStorage.getItem("tt3"));return s&&s.phase!=="menu"&&s.phase!=="lobby"&&!s.win?s:null}catch(e){return null}}
function resume(){const s=sv();if(!s)return;S=s;S.players.forEach(q=>q.by=myId);room=null;code="";host=true;if(S.phase==="rolling")S.phase="roll";if(S.phase==="moving")land(cur());else render()}
function toLobby(o){draft.on=!!o;S.phase="lobby";render()}
function menu(a){a.innerHTML=`<div class="menu">${fl}${sky()}<div class="logo">🎲</div><div class="ttl"><span>WELCOME TO</span>TYCOON TOWN</div><p style="z-index:2;margin:8px 0 14px;opacity:.9;text-align:center">Roll, buy, and build with the whole family!</p>${sv()?'<button class="mb p" onclick="resume()">⏯ Continue game</button>':""}<button class="mb ${sv()?"":"p"}" onclick="toLobby()">▶ ${sv()?"New game":"Play"}</button><button class="mb" onclick="toLobby(1)">🌐 Play online</button><button class="mb" onclick="draft.how=!draft.how;render()">❓ How to play</button>${draft.how?`<div class="how">🎲 Roll and move around the board<br>🏠 Buy properties and collect rent<br>🧒 Little kid mode: coins, no going broke<br>🎩 Classic mode: real money, last player standing wins</div>`:""}</div>`}
function rmP(i){S.players.splice(i,1);sync()}
function lobby(a){const ok=S.players.length>1;
 a.innerHTML=`${room?"":`<button class="x" onclick="S.phase='menu';render()">← Menu</button>`}<p class="sub">Set up your game</p>
 <div class="card"><h2>1 · Players</h2>${S.players.map((p,i)=>`<div class="pc"><span class="pe">${p.e}</span><span class="pn">${esc(p.n)}<small>${p.mode==="kid"?"🧒 Little kid":"🎩 Classic"}${p.cpu?" · CPU":p.by===myId?"":" · online"}</small></span>${host?`<button class="x" onclick="rmP(${i})">✕</button>`:""}</div>`).join("")||"<small>No players yet. Add some below.</small>"}</div>
 <div class="card"><h2>2 · Add a player</h2><input value="${esc(draft.name)}" oninput="draft.name=this.value" placeholder="Name" maxlength="12">
 <div class="tr">${TOK.map(t=>`<button class="${draft.e===t?"on":""}" onclick="pick('e','${t}')">${t}</button>`).join("")}</div>
 <div class="seg"><button class="${draft.mode==="kid"?"on":""}" onclick="pick('mode','kid')"><b>🧒 Little kid</b><small>Coins, easy rent, never goes broke</small></button><button class="${draft.mode==="big"?"on":""}" onclick="pick('mode','big')"><b>🎩 Classic</b><small>Real money and bankruptcy</small></button></div>
 <div class="two"><button onclick="addP()">➕ Add player</button><button class="alt" onclick="addCPU()">🤖 Add CPU</button></div></div>
 <details class="card" ${code||draft.on||draft.err?"open":""}><summary>3 · Online options <small>(optional)</small></summary>
 ${code?`<p>Share this code:<br><b style="font-size:28px;letter-spacing:3px">${code.toUpperCase()}</b></p>`:`<button class="alt" onclick="hostRoom()">Host a room</button>`}
 ${draft.err?`<p style="color:#c62828;font-weight:700">${esc(draft.err)}</p>`:""}<input id="cd" placeholder="Or enter a room code" maxlength="5"><button class="alt" onclick="joinRoom()">Join room</button></details>
 ${host?`<button class="go ${ok?"":"off"}" onclick="start()">▶ Start game</button><p class="sub">${ok?"Ready to play!":"Add at least 2 players"}</p>`:`<p class="sub">Waiting for the host to start…</p>`}`}
function lobbyOld(a){const mp=S.players.filter(p=>p.by===myId);
 a.innerHTML=`<div class="card"><b>Add a player</b><input id="nm" placeholder="Name" maxlength="12"><div class="row">${TOK.map(t=>`<button class="tok ${draft.e===t?"sel":""}" onclick="draft.e='${t}';render()">${t}</button>`).join("")}</div>
 <div class="row"><button class="tok ${draft.mode==="kid"?"sel":""}" style="font-size:16px" onclick="draft.mode='kid';render()">🧒 Little kid</button><button class="tok ${draft.mode==="big"?"sel":""}" style="font-size:16px" onclick="draft.mode='big';render()">🎩 Classic</button></div>
 <button onclick="addP()">➕ Add</button><button class="alt" onclick="addCPU()">🤖 Add CPU</button></div>
 <div class="card"><b>Players</b>${S.players.map(p=>`<div class="pl"><span>${p.e} ${p.n} ${p.mode==="kid"?"🧒":"🎩"}</span><span>${p.by===myId?"this device":"online"}</span></div>`).join("")||"<small>None yet</small>"}</div>
 <div class="card"><b>Play together online</b><div class="row"><button class="alt" onclick="hostRoom()">Host a room</button></div><input id="cd" placeholder="Room code to join" maxlength="5"><button class="alt" onclick="joinRoom()">Join</button>${code?`<div>Room code: <b style="font-size:24px">${code}</b></div>`:""}</div>
 ${host?`<button class="${S.players.length>1?"":"off"}" onclick="start()">▶ Start game</button>`:"<small>Waiting for the host to start…</small>"}`}
function addP(){const n=draft.name.trim()||"Player "+(S.players.length+1);draft.name="";const p={n,e:draft.e,mode:draft.mode,m:draft.mode==="kid"?1000:1500,pos:0,jail:0,by:myId};
 if(host){S.players.push(p);sync()}else room.emit("join",p).catch(()=>{draft.err="Couldn’t send your player. Ask the host to give you edit (Contributor) access.";render()})}
function addCPU(){const n=["Robo","Beep","Bolt","Pixel"][S.players.length%4],p={n:"🤖 "+n,e:TOK.find(t=>!S.players.some(q=>q.e===t))||TOK[0],mode:draft.mode,m:draft.mode==="kid"?1000:1500,pos:0,jail:0,by:myId,cpu:1};
 if(host){S.players.push(p);sync()}else room.emit("join",p).catch(()=>{})}
let cpuT=0;
function cpu(){clearTimeout(cpuT);const p=cur();if(S.phase==="lobby"||S.phase==="rolling"||S.phase==="moving"||S.win||!p||!p.cpu||p.by!==myId)return;const t=S.turn,ph=S.phase;
 cpuT=setTimeout(()=>{if(S.turn!==t||S.phase!==ph||S.win||S.au)return;const q=cur();
  if(ph==="debt")return cpuDebt();
  if(ph==="roll"||ph==="end")cpuBuild(q);
  if(ph==="roll"&&q.jail&&q.goj)useCard();
  if(ph==="roll"&&q.jail&&q.m>500)payOut();
  if(ph==="roll")roll();
  else if(ph==="buy"){if(q.m>=T[q.pos].p+(q.mode==="kid"?0:200))buy();else skip()}
  else if(S.dbl&&!q.jail&&!q.out)again();else next()},1000)}
function start(){if(S.players.length<2)return;S.phase="roll";S.turn=0;sync()}
let peer=null,conns=[],hostConn=null,hd={};
const rm={emit(t,d){const m={t,d};try{if(host)conns.forEach(c=>c.open&&c.send(m));else if(hostConn&&hostConn.open)hostConn.send(m);else return Promise.reject(new Error("offline"));return Promise.resolve()}catch(e){return Promise.reject(e)}},on(t,f){hd[t]=f}};
function got(m,from){if(!m||!m.t)return;if(host&&m.t==="state")conns.forEach(c=>c!==from&&c.open&&c.send(m));const f=hd[m.t];if(f)f({data:m.d,isMe:false})}
function conn(c,h){draft.err="";if(typeof Peer==="undefined"){draft.err="Online play couldn\u2019t load. Check your internet connection and reload the page.";return render()}
 if(peer){peer.destroy();peer=null}conns=[];hostConn=null;hd={};
 const fail=m=>{draft.err=m;room=null;code="";host=true;render()};
 peer=h?new Peer("tycoon-"+c):new Peer();
 peer.on("error",e=>fail(e.type==="peer-unavailable"?"Room not found. Check the code and try again.":e.type==="unavailable-id"?"That room code is taken. Try again.":"Connection problem ("+(e.type||"unknown")+"). Try again."));
 const ready=()=>{room=rm;code=c;host=h;rm.on("state",m=>{if(m.isMe)return;S=m.data;render()});rm.on("join",m=>{if(!host||S.phase!=="lobby")return;S.players.push(m.data);sync()});render()};
 if(h){peer.on("open",()=>{ready();sync()});
  peer.on("connection",cn=>{cn.on("open",()=>{conns.push(cn);cn.send({t:"state",d:S})});cn.on("data",m=>m&&m.t==="hello"?cn.send({t:"state",d:S}):got(m,cn));cn.on("close",()=>{conns=conns.filter(x=>x!==cn)})})}
 else peer.on("open",()=>{const cn=peer.connect("tycoon-"+c,{reliable:true});hostConn=cn;cn.on("open",()=>{ready();cn.send({t:"hello"})});cn.on("data",m=>got(m,cn));cn.on("close",()=>fail("The host left the game."))})}
function hostRoom(){conn(Math.random().toString(36).slice(2,7),true)}
function joinRoom(){const c=$("cd").value.trim().toLowerCase();if(c)conn(c,false)}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script></body></html>
